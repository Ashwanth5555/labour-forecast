server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Ingestion and training can run for minutes; the UI polls while they do.
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # The frontend calls /api/..., which the backend also mounts under /api.
    location /api/ {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Container health probe, answered by the backend.
    location = /health {
        proxy_pass http://127.0.0.1:8300/health;
        access_log off;
    }

    # Vite fingerprints asset filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html names the fingerprinted bundle, so it must always revalidate.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Single-page app: client-side routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
